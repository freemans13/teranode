apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/scaling-miner

namespace: m3

nameSuffix: "3"

configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3
    name: shared-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.asset
    name: asset-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.blockassembly
    name: blockassembly-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.blockvalidation
    name: blockvalidation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.subtreevalidation
    name: subtreevalidation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.coinbase
    name: coinbase-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.propagation
    name: propagation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3.blockpersister
    name: blockpersister-config-m
patches:
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1blockassembly.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://blockassembly-service3.m3.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["blockassembly_subtrees","blockassembly_transactions","blockassembly_add_tx_duration_seconds_bucket","blockassembly_best_block_height","blockassembly_current_block_height"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=blockassembly
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1propagation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://propagation-service3.m3.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["propagation_processed_transactions","validator_transactions_validate_micros_bucket","validator_transactions_store_utxos_micros_bucket","validator_transactions_spend_utxos_micros_bucket"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=propagation
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1tx-blaster.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://tx-blaster-service3.m3.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["tx_blaster_processed_transactions",]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=tx-blaster

  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value: 
         - m3.scaling.ubsv.dev
    target:
      kind: Certificate
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: propagation-service3
    target:
      labelSelector: service=propagation
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: p2p-service3
    target:
      kind: IngressRouteTCP
      labelSelector: service=p2p
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: coinbase-service3
    target:
      kind: IngressRouteTCP
      labelSelector: service=coinbase
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: asset-service3
    target:
      kind: IngressRouteTCP
      labelSelector: service=asset
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: asset-service3
      - op: replace
        path: /spec/routes/0/match
        value: Host(`m3.scaling.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=asset
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: p2p-service3
      - op: replace
        path: /spec/routes/0/match
        value: Host(`m3.scaling.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=p2p
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: m3
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-m3
    target:
      kind: Deployment
