apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/allinone-miner

namespace: miner-ap-1

nameSuffix: -ap-1

configMapGenerator:
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-ap-south-1-agent.jaeger.svc.cluster.local
    name: config-miner
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-ap-south-1-agent.jaeger.svc.cluster.local
    name: tx-blaster-config
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.AP.1
    name: config-miner
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.AP.1
    name: tx-blaster-config

patches:
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value: 
         - miner-ap-1.allinone.ubsv.dev
    target:
      kind: Certificate
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner-ap-1
    target:
      kind: IngressRouteTCP
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner-ap-1
      - op: replace
        path: /spec/routes/0/match
        value: Host(`miner-ap-1.allinone.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: miner-ap-1
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-miner-ap-1
    target:
      kind: Deployment

  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: postgres-pvc-ap-1
    target:
      kind: Deployment
      labelSelector: service=postgres
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: subtree-pvc-ap-1
    target:
      kind: Deployment
      labelSelector: service=miner
