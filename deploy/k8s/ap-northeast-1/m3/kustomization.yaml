apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/scaling-miner

namespace: m3

nameSuffix: "3"
commonLabels:
  miner: m3

configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m3
    name: shared-config-m

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`m3.scaling.ubsv.dev`)
    target:
      kind: IngressRouteTCP
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: m3
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-m3
    target:
      kind: Deployment
