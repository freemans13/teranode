apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/allinone-miner

namespace: miner8

nameSuffix: "8"
commonLabels:
  app: miner8

configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.8
    name: config-miner
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.8
    name: tx-blaster-config
  - behavior: merge
    literals:
      - coinbase_grpcAddress=miner8.miner8.svc.cluster.local:8093
    name: tx-blaster-config

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`miner8.allinone.ubsv.dev`)
    target:
      kind: IngressRouteTCP
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner8
    target:
      kind: IngressRouteTCP
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: miner8
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-miner8
    target:
      kind: Deployment
