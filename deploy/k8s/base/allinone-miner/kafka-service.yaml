apiVersion: v1
kind: Service
metadata:
  name: kafka-service

  labels:
    app: kafka
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: kafka-external
      port: 9094
      targetPort: 9094
      protocol: TCP