apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: http-80-asset
  labels:
    service: miner
spec:
  entryPoints:
    - web # Ensure this corresponds to HTTP (port 80) in Traefik
  routes:
  - match: Host(`miner.allinone.ubsv.dev`)
    kind: Rule
    services:
    - name: miner
      port: 8090
