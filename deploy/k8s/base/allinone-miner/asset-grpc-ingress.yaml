apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: tcp-8091-asset-miner
  labels:
    service: miner
spec:
  entryPoints:
    - ast-grpc
  routes:
  - match: HostSNI(`miner.allinone.ubsv.dev`)
    services:
    - name: miner
      port: 8091
  tls:
    # use miner-cert
#    secretName: miner-tls
    passthrough: true
