apiVersion: v1
kind: Service
metadata:
  name: miner
  namespace: miner
  labels:
    service: miner
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    service: miner
  ports:
    - name: delve
      port: 4040
      targetPort: 4040
      protocol: TCP
    - name: seeder
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: propagation
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: blockchain
      port: 8087
      targetPort: 8087
      protocol: TCP
    - name: bootstrap-grpc
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: blob-http
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: blob-grpc
      port: 8091
      targetPort: 8091
    - name: coinbase-grpc
      port: 8093
      targetPort: 8093
    - name: bootstrap-http
      port: 8099
      targetPort: 8099
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: p2p
      port: 9905
      targetPort: 9905
      protocol: TCP
    - name: p2p-http
      port: 9906
      targetPort: 9906
      protocol: TCP
