apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: p2p-ingress-9905
  labels:
    service: miner
  # annotations:
  #   kubernetes.io/ingress.class: "traefik-allinone"
spec:
  entryPoints:
    - p2p
  routes:
    - match: Host(`*`)
      services:
        - name: miner
          port: 9905
