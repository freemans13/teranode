apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    service: postgres
  # annotations:
  #   prometheus.io/port: "9091"
  #   prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    service: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
