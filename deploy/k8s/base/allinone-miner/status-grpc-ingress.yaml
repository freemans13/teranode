apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: status-ingress-tcp-9909
  labels:
    service: miner
spec:
  entryPoints:
    - status-grpc
  routes:
  - match: HostSNI(`miner.allinone.ubsv.dev`)
    services:
    - name: miner
      port: 9909
  tls:
    passthrough: true
