apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain

  labels:
    app: blockchain
    project: service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      serviceAccountName: miner-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: blockchain
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: blockchain
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/ubsv:d735642cb4f413067d314a0b1dff14b66c1b3adc
          args: [ "-blockchain=1" ]
          env:
            - name: SETTINGS_CONTEXT
              value: scaling-miner.m1
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: SERVICE_NAME
              value: blockchain-service
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 8087
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 2Gi
              cpu: "2"
            limits:
              memory: 2Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
