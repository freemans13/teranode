apiVersion: v1
kind: Service
metadata:
  name: blockvalidation-service

  labels:
    app: blockvalidation
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: blockvalidation
  ports:
    - name: tcp
      port: 8088
      targetPort: 8088
      protocol: TCP
    - name: frpc
      port: 8288
      targetPort: 8288
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: debugger
      port: 4040
      targetPort: 4040
      protocol: TCP
