apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockvalidation

  labels:
    app: blockvalidation
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockvalidation
  strategy:
    type: Recreate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: blockvalidation
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: blockvalidation
                topologyKey: "kubernetes.io/hostname"
      nodeSelector:
        role: massive
      tolerations:
        - key: role
          value: massive
          operator: Equal
          effect: NoSchedule
      containers:
        - name: blockvalidation
          image: REPO:IMAGE:TAG
          args: [ "-blockvalidation=1" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
            - configMapRef:
                name: blockvalidation-config-m
          env:
            - name: SERVICE_NAME
              value: blockvalidation-service
          ports:
            - containerPort: 8088
              protocol: TCP
            - containerPort: 8288
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 1400Gi
              cpu: "186"
            limits:
              memory: 1400Gi
              cpu: "186"
          volumeMounts:
            - mountPath: /data/subtreestore-ttl-1/
              name: subtree-store-ttl-1
            - mountPath: /data/subtreestore-ttl-2/
              name: subtree-store-ttl-2
            - mountPath: /data/subtreestore-ttl-3/
              name: subtree-store-ttl-3
            - mountPath: /data/subtreestore-ttl-4/
              name: subtree-store-ttl-4
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
      volumes:
        - name: subtree-store-ttl-1
          persistentVolumeClaim:
            claimName: blockvalidation-pvc-1
        - name: subtree-store-ttl-2
          persistentVolumeClaim:
            claimName: blockvalidation-pvc-2
        - name: subtree-store-ttl-3
          persistentVolumeClaim:
            claimName: blockvalidation-pvc-3
        - name: subtree-store-ttl-4
          persistentVolumeClaim:
            claimName: blockvalidation-pvc-4
