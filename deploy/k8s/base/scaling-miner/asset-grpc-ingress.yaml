apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: m1-ingressroute-tcp-8091

spec:
  entryPoints:
    - ast-grpc
  routes:
  - match: HostSNI(`m1.scaling.ubsv.dev`)
    services:
    - name: asset-service1
      port: 8091
  tls:
    # use m1-cert
    passthrough: true
