apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockassembly-blaster

  labels:
    app: blockassembly-blaster
    project: service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blockassembly-blaster
  template:
    metadata:
      labels:
        app: blockassembly-blaster
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: blockassembly-blaster
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: blockassembly-blaster
          image: REPO:IMAGE:TAG
          command:
            - ./blockassemblyblaster.run
          args: [ "-workers=200", "-broadcast=frpc", "-batch_size=10" ]
          env:
            - name: SERVICE_NAME
              value: blockassembly-blaster-service
            - name: SETTINGS_CONTEXT
              value: scaling.m1
            - name: GRPC_GO_LOG_VERBOSITY
              value: info
            - name: GRPC_GO_LOG_SEVERITY
              value: info
          ports:
            - containerPort: 8085
              protocol: TCP
            - containerPort: 8185
              protocol: TCP
            - containerPort: 8285
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 9092
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
            - containerPort: 6060
              protocol: TCP
          resources:
            requests:
              memory: 500Mi
              cpu: "4"
            limits:
              memory: 500Mi
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
