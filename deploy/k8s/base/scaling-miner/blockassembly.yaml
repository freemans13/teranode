apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockassembly

  labels:
    app: blockassembly
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockassembly
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: blockassembly
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: blockassembly
                topologyKey: "kubernetes.io/hostname"
      nodeSelector:
        role: massive
      tolerations:
        - key: role
          value: massive
          operator: Equal
          effect: NoSchedule
      containers:
        - name: blockassembly
          image: REPO:IMAGE:TAG
          args: [ "-blockassembly=1" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: blockassembly-service
          ports:
            - containerPort: 8055
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 720Gi
              cpu: "90"
            limits:
              memory: 720Gi
              cpu: "90"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
