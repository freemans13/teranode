apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: miner
  name: miner

spec:
  replicas: 1
  selector:
    matchLabels:
      app: miner
  template:
    metadata:
      labels:
        app: miner
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: miner
                topologyKey: kubernetes.io/hostname
              weight: 100
      containers:
        - args:
            - -miner=1
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: miner-service
            - name: mine_initial_blocks_count
              value: "5000"
          image: REPO:IMAGE:TAG
          imagePullPolicy: IfNotPresent
          name: miner
          ports:
            - containerPort: 8089
              protocol: TCP
            - containerPort: 8092
              protocol: TCP
            - containerPort: 8099
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            limits:
              cpu: 2
              memory: 2Gi
            requests:
              cpu: 2
              memory: 2Gi
      serviceAccountName: sa-m
