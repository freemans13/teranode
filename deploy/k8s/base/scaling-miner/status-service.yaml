apiVersion: v1
kind: Service
metadata:
  name: status-service

  labels:
    app: status
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: status
  ports:
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: delve
      port: 4041
      targetPort: 4040
      protocol: TCP
    - name: status-http
      port: 9908
      targetPort: 9908
      protocol: TCP
    - name: status-grpc
      port: 9909
      targetPort: 9909
      protocol: TCP