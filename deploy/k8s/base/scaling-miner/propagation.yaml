apiVersion: apps/v1
kind: Deployment
metadata:
  name: propagation

  labels:
    app: propagation
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: propagation
  template:
    metadata:
      labels:
        app: propagation
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: propagation
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: propagation
          image: REPO:IMAGE:TAG
          args: [ "-propagation=1" ]
          # command: "You can override the entrypoint with a command."
#          command: ["./dlv", "--listen=:4040", "--continue", "--accept-multiclient", "--headless=true", "--api-version=2", "exec", "./ubsv.run", "--"]
          #          command: [ "./ubsv.run" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: propagation-service
          ports:
            - containerPort: 4040
              protocol: TCP
            - containerPort: 8833
              protocol: TCP
            - containerPort: 8084
              protocol: TCP
            - containerPort: 8184
              protocol: TCP
            - containerPort: 8284
              protocol: TCP
            - containerPort: 8384
              protocol: TCP
            - containerPort: 9905
              protocol: TCP
            - containerPort: 9906
              protocol: TCP
          resources:
            requests:
              memory: 8Gi
              cpu: "8"
            limits:
              memory: 8Gi
              cpu: "8"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
