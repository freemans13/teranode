apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
      worker_connections  1024;
    }

    http {
      # Rate limiting configuration
      limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

      # Server configuration
      server {
        listen 80 default_server;
        # listen [::]:80 default_server;
        # listen 443 ssl default_server;
        # listen [::]:443 ssl default_server;

        # # SSL configuration
        # ssl_certificate /etc/nginx/ssl/tls.crt;
        # ssl_certificate_key /etc/nginx/ssl/tls.key;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;

        resolver kube-dns.kube-system.svc.cluster.local valid=5s;

        location /faucet {
          set $faucet faucet-service1.m1.svc.cluster.local:8097;
          # limit_req zone=mylimit burst=10 nodelay;
          proxy_pass http://$faucet;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /p2p-ws {
          set $p2p p2p-service1.m1.svc.cluster.local:9906;
          # limit_req zone=mylimit burst=10 nodelay;
          proxy_pass http://$p2p;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          set $asset asset-service1.m1.svc.cluster.local:8090;
          limit_req zone=mylimit burst=100 nodelay;
          proxy_pass http://$asset;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          # proxy_set_header Host $host;
          proxy_set_header Host "m1.scaling.ubsv.dev";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }

