apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation

  labels:
    app: validation
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation
  template:
    metadata:
      labels:
        app: validation
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: validation
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: validation
          image: REPO:IMAGE:TAG
          args: [ "-validator=1" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: validation-service
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 8181
              protocol: TCP
            - containerPort: 8281
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 2Gi
              cpu: "8"
            limits:
              memory: 2Gi
              cpu: "8"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
