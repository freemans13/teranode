apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset
  labels:
    app: asset
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        ad.datadoghq.com/asset.checks: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://asset-service1.m1.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["propagation_processed_transactions","blockassembly_subtrees","blockassembly_transactions","tx_blaster_processed_transactions","blockassembly_add_tx_duration_seconds_bucket","validator_transactions_validate_micros_bucket","validator_transactions_store_utxos_micros_bucket","validator_transactions_spend_utxos_micros_bucket"]
                      }
                  ]
              }
          }
      labels:
        app: asset
    spec:
      nodeSelector:
        role: asset
      tolerations:
        - key: role
          value: asset
          operator: Equal
          effect: NoSchedule
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: asset
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: asset
          image: REPO:IMAGE:TAG
          args: [ "-asset=1" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
            - configMapRef:
                name: asset-config-m
          env:
            - name: SERVICE_NAME
              value: asset-service
          ports:
            - containerPort: 8090
              protocol: TCP
            - containerPort: 8099
              protocol: TCP
            - containerPort: 8091
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 200Gi
              cpu: "100"
            limits:
              memory: 200Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: lustre-storage
              mountPath: /data/subtreestore
            - name: scaling-tls
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: lustre-storage
          persistentVolumeClaim:
            claimName: lustre-pvc
        - name: scaling-tls
          secret:
            secretName: scaling-tls
            items:
              - key: tls.crt
                path: ubsv.crt
              - key: tls.key
                path: ubsv.key
