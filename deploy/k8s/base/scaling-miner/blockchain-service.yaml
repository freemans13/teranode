apiVersion: v1
kind: Service
metadata:
  name: blockchain-service

  labels:
    app: blockchain
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: blockchain
  ports:
    - name: tcp
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: blockchain
      port: 8087
      targetPort: 8087
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: debugger
      port: 4040
      targetPort: 4040
      protocol: TCP
