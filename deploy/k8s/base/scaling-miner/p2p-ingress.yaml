apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: p2p-ingress-9905
  labels:
    service: p2p
spec:
  entryPoints:
    - p2p
  routes:
    - match: HostSNI(`m1.scaling.ubsv.dev`)
      services:
        - name: asset-service
          port: 9905
  tls:
    passthrough: true
