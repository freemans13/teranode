apiVersion: v1
kind: Service
metadata:
  name: subtreevalidation-service

  labels:
    app: subtreevalidation
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: subtreevalidation
  ports:
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: debugger
      port: 4040
      targetPort: 4040
      protocol: TCP
