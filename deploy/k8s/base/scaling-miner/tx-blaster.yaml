apiVersion: apps/v1
kind: Deployment
metadata:
  name: tx-blaster

  labels:
    app: tx-blaster
    project: service
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tx-blaster
  template:
    metadata:
      annotations:
        ad.datadoghq.com/tx-blaster.checks: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://tx-blaster-service1.m1.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["propagation_processed_transactions","blockassembly_subtrees","blockassembly_transactions","tx_blaster_processed_transactions","blockassembly_add_tx_duration_seconds_bucket","validator_transactions_validate_micros_bucket","validator_transactions_store_utxos_micros_bucket","validator_transactions_spend_utxos_micros_bucket"]
                      }
                  ]
              }
          }
      labels:
        app: tx-blaster
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: tx-blaster
                topologyKey: "kubernetes.io/hostname"
      nodeSelector:
        role: tx-blaster
      tolerations:
        - key: role
          value: tx-blaster
          operator: Equal
          effect: NoSchedule
      containers:
        - name: tx-blaster
          image: REPO:IMAGE:TAG
          command:
            - ./blaster.run
          args: [ "-workers=5600" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: tx-blaster-service
          ports:
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 32Gi
              cpu: "27"
            limits:
              memory: 32Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9092
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: scaling-tls
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: scaling-tls
          secret:
            secretName: scaling-tls
            items:
              - key: tls.crt
                path: ubsv.crt
              - key: tls.key
                path: ubsv.key