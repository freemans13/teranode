apiVersion: v1
kind: Service
metadata:
  name: utxo-blaster-service

  labels:
    app: utxo-blaster
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: utxo-blaster
  ports:
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
