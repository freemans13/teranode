apiVersion: v1
kind: Service
metadata:
  name: asset-service

  labels:
    app: asset
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: asset
  ports:
    - name: asset-grpc
      port: 8091
      targetPort: 8091
      protocol: TCP
    - name: asset-http
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: debugger
      port: 4040
      targetPort: 4040
      protocol: TCP