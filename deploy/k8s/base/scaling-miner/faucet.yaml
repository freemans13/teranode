apiVersion: apps/v1
kind: Deployment
metadata:
  name: faucet
  labels:
    app: faucet
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faucet
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: faucet
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: faucet
                topologyKey: "kubernetes.io/hostname"
      tolerations:
        - key: service
          value: faucet
          operator: Equal
          effect: NoSchedule
      containers:
        - name: faucet
          image: REPO:IMAGE:TAG
          imagePullPolicy: Always
          args: ["-faucet=1"]
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: faucet-service
          ports:
            - containerPort: 8093
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 5Gi
              cpu: "2"
            limits:
              memory: 5Gi
