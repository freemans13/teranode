apiVersion: apps/v1
kind: Deployment
metadata:
  name: status

  labels:
    app: status
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: status
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: status
          image: REPO:IMAGE:TAG
          args: [ "-status=1" ]
          # command: "You can override the entrypoint with a command."
#          command: ["./dlv", "--listen=:4040", "--continue", "--accept-multiclient", "--headless=true", "--api-version=2", "exec", "./ubsv.run", "--"]
          #          command: [ "./ubsv.run" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
          env:
            - name: SERVICE_NAME
              value: status-service
          ports:
            - containerPort: 4040
              protocol: TCP
            - containerPort: 9908
              protocol: TCP
            - containerPort: 9909
              protocol: TCP
            - containerPort: 9901
              protocol: TCP
          resources:
            requests:
              memory: 2Gi
              cpu: "1"
            limits:
              memory: 2Gi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
