apiVersion: v1
kind: Service
metadata:
  name: validation-service

  labels:
    app: validation
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app: validation
  ports:
    - name: tcp
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: validation
      port: 8088
      targetPort: 8088
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
