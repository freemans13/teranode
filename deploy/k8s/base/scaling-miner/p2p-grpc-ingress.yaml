apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: p2p-ingress-tcp-9907
  labels:
    service: p2p
spec:
  entryPoints:
    - p2p-grpc
  routes:
  - match: HostSNI(`m.scaling.ubsv.dev`)
    services:
    - name: p2p-service
      port: 9907
  tls:
    passthrough: true
