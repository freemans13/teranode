apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockpersister

  labels:
    app: blockpersister
    project: service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: blockpersister
  template:
    metadata:
      labels:
        app: blockpersister
    spec:
      serviceAccountName: sa-m
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: blockpersister
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: blockpersister
          image: REPO:IMAGE:TAG
          args: [ "-blockpersister=1" ]
          # command: "You can override the entrypoint with a command."
          # command: ["./dlv", "--listen=:4040", "--continue", "--accept-multiclient", "--headless=true", "--api-version=2", "exec", "./ubsv.run", "--"]
          #          command: [ "./ubsv.run" ]
          envFrom:
            - configMapRef:
                name: shared-config-m
            - configMapRef:
                name: blockpersister-config-m
          env:
            - name: SERVICE_NAME
              value: blockpersister-service
          ports:
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 128Gi
              cpu: "16"
            limits:
              memory: 128Gi
              cpu: "16"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 1
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: lustre-storage
              mountPath: /data/subtreestore
            - name: blockpersister-storage
              mountPath: /data/workdir
      volumes:
        - name: lustre-storage
          persistentVolumeClaim:
            claimName: lustre-pvc
        - name: blockpersister-storage
          persistentVolumeClaim:
            claimName: blockpersister-pvc
