apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bootstrap
  name: bootstrap
  namespace: bootstrap-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bootstrap
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: bootstrap
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bootstrap
                topologyKey: kubernetes.io/hostname
              weight: 100
      containers:
        - args:
            - -bootstrap=1
          env:
            - name: SETTINGS_CONTEXT
              value: scaling-miner.m1
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: SERVICE_NAME
              value: bootstrap-service
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/IMAGE:TAG
          imagePullPolicy: IfNotPresent
          name: bootstrap
          ports:
            - containerPort: 8089
              protocol: TCP
            - containerPort: 8099
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi
      serviceAccountName: miner-service-account
