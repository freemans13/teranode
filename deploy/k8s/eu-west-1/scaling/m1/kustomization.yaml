apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/scaling-miner

namespace: m1

nameSuffix: "1"

configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1
    name: shared-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.asset
    name: asset-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.blockassembly
    name: blockassembly-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.blockvalidation
    name: blockvalidation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.subtreevalidation
    name: subtreevalidation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.coinbase
    name: coinbase-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.propagation
    name: propagation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m1.blockpersister
    name: blockpersister-config-m
patches:
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1subtreevalidation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://subtreevalidation-service1.m1.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["subtreevalidation_validate_subtree"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=subtreevalidation
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1blockassembly.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://blockassembly-service1.m1.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["blockassembly_subtrees","blockassembly_transactions","blockassembly_add_tx_duration_seconds_bucket","blockassembly_best_block_height","blockassembly_current_block_height","blockassembly_add_tx_duration_seconds_count"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=blockassembly
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1propagation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://propagation-service1.m1.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["propagation_processed_transactions","validator_transactions_validate_micros_bucket","validator_transactions_store_utxos_micros_bucket","validator_transactions_spend_utxos_micros_bucket"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=propagation
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1propagation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://tx-blaster-service1.m1.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["tx_blaster_processed_transactions",]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=tx-blaster
  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
         - m1.scaling.ubsv.dev
    target:
      kind: Certificate
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: propagation-service1
    target:
      labelSelector: service=propagation
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: p2p-service1
    target:
      kind: IngressRouteTCP
      labelSelector: service=p2p
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: coinbase-service1
    target:
      kind: IngressRouteTCP
      labelSelector: service=coinbase
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: asset-service1
    target:
      kind: IngressRouteTCP
      labelSelector: service=asset
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: asset-service1
      - op: replace
        path: /spec/routes/0/match
        value: Host(`m1.scaling.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=asset
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: p2p-service1
      - op: replace
        path: /spec/routes/0/match
        value: Host(`m1.scaling.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=p2p
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: m1
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-m1
    target:
      kind: Deployment
