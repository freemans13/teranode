apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-status
data:
  status.conf: |
    server {
      listen 81;

      location /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
      }

      location / {
        return 404;
      }
    }
