apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/allinone-miner

namespace: miner2

nameSuffix: "2"
commonLabels:
  app: miner2

configMapGenerator:
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-eu-west-1-agent.jaeger.svc.cluster.local
    name: config-miner
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-eu-west-1-agent.jaeger.svc.cluster.local
    name: tx-blaster-config
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.2
    name: config-miner
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.2
    name: tx-blaster-config
  - behavior: merge
    literals:
      - coinbase_grpcAddress=miner2.miner2.svc.cluster.local:8093
    name: tx-blaster-config

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner2
    target:
      kind: IngressRouteTCP
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: miner2
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-miner2
    target:
      kind: Deployment
