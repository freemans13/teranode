apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/allinone-miner

namespace: minerEU1

nameSuffix: "EU1"
commonLabels:
  app: minerEU1

configMapGenerator:
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-eu-west-1-agent.jaeger.svc.cluster.local
    name: config-miner
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-eu-west-1-agent.jaeger.svc.cluster.local
    name: tx-blaster-config
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.EU.1
    name: config-miner
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.EU.1
    name: tx-blaster-config

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: minerEU1
    target:
      kind: IngressRouteTCP
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: minerEU1
      - op: replace
        path: /spec/routes/0/match
        value: Host(`minerEU1.allinone.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: minerEU1
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-minerEU1
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/persistentVolumeClaim/claimName
        value: postgres-pvcEU1
    target:
      kind: Deployment
      labelSelector: service=miner
