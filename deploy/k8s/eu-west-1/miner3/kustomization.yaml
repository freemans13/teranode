apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/allinone-miner

namespace: miner3

nameSuffix: "3"
commonLabels:
  app: miner3

configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.3
    name: config-miner
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.3
    name: tx-blaster-config
  - behavior: merge
    literals:
      - coinbase_grpcAddress=coinbase-service3.miner3.svc.cluster.local:8093
    name: tx-blaster-config
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.coinbase.3
    name: coinbase-config
  - behavior: merge
    literals:
      - blobserver_httpAddress=miner3.allinone.ubsv.dev
    name: coinbase-config

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`miner3.allinone.ubsv.dev`)
    target:
      kind: IngressRouteTCP
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner3
    target:
      kind: IngressRouteTCP
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: miner3
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-miner3
    target:
      kind: Deployment
