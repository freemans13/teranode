apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/scaling-miner

namespace: m5

nameSuffix: "5"


configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5
    name: shared-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.asset
    name: asset-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.blockassembly
    name: blockassembly-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.blockvalidation
    name: blockvalidation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.subtreevalidation
    name: subtreevalidation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.coinbase
    name: coinbase-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.propagation
    name: propagation-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m5.blockpersister
    name: blockpersister-config-m
patches:
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1subtreevalidation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://subtreevalidation-service5.m5.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["subtreevalidation_validate_subtree"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=subtreevalidation
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1blockvalidation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://blockvalidation-service5.m5.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["blockvalidation_block_found_ch","blockvalidation_validate_block_duration_seconds_bucket"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=blockvalidation
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1blockassembly.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://blockassembly-service5.m5.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["blockassembly_subtrees","blockassembly_transactions","blockassembly_add_tx_duration_seconds_bucket","blockassembly_best_block_height","blockassembly_current_block_height","blockassembly_add_tx_duration_seconds_count"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=blockassembly
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1propagation.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://propagation-service5.m5.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["propagation_processed_transactions","validator_transactions_validate_micros_bucket","validator_transactions_store_utxos_micros_bucket","validator_transactions_spend_utxos_micros_bucket"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=propagation
  - patch: |-
      - op: replace
        path: "/spec/template/metadata/annotations/ad.datadoghq.com~1tx-blaster.checks"
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://tx-blaster-service5.m5.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          - "metrics": ["tx_blaster_processed_transactions",]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: app=tx-blaster

  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
         - m5.scaling.ubsv.dev
    target:
      kind: Certificate
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: propagation-service5
    target:
      labelSelector: service=propagation
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: p2p-service5
    target:
      kind: IngressRouteTCP
      labelSelector: service=p2p
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: coinbase-service5
    target:
      kind: IngressRouteTCP
      labelSelector: service=coinbase
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: asset-service5
    target:
      kind: IngressRouteTCP
      labelSelector: service=asset
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: asset-service5
      - op: replace
        path: /spec/routes/0/match
        value: Host(`m5.scaling.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=asset
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: p2p-service5
      - op: replace
        path: /spec/routes/0/match
        value: Host(`m5.scaling.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=p2p
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: m5
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-m5
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::434394763103:role/eks-s3-access-role-cc1
    target:
      kind: ServiceAccount
