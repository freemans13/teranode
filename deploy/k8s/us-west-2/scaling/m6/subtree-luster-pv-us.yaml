apiVersion: v1
kind: PersistentVolume
metadata:
  name: subtree-lustre-pv
spec:
  capacity:
    storage: 1200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  mountOptions:
    - flock
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: fsx.csi.aws.com
    volumeHandle: fs-0ddce0ef2e340de86
    volumeAttributes:
      dnsname: fs-0ddce0ef2e340de86.fsx.us-west-2.amazonaws.com
      mountname: yifilbev
