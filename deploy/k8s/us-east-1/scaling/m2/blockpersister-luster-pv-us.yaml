apiVersion: v1
kind: PersistentVolume
metadata:
  name: blockpersister-lustre-pv
spec:
  capacity:
    storage: 1200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  mountOptions:
    - flock
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: fsx.csi.aws.com
    volumeHandle: fs-0de41aea48def00ef
    volumeAttributes:
      dnsname: fs-0de41aea48def00ef.fsx.us-east-1.amazonaws.com
      mountname: r7grpb4v
