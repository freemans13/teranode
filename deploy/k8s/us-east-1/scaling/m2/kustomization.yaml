apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/scaling-miner

namespace: m2

nameSuffix: "2"
commonLabels:
  miner: m2

configMapGenerator:
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m2
    name: shared-config-m
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=scaling.m2
    name: coinbase-config

patches:
  - patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: HostSNI(`m2.scaling.ubsv.dev`)
    target:
      kind: IngressRouteTCP
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: m2
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-m2
    target:
      kind: Deployment
