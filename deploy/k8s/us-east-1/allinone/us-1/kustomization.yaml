apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/allinone-miner

namespace: miner-us-1

nameSuffix: -us-1

configMapGenerator:
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-eu-west-1-agent.jaeger.svc.cluster.local
    name: config-miner
  - behavior: merge
    literals:
      - JAEGER_AGENT_HOST=jaeger-eu-west-1-agent.jaeger.svc.cluster.local
    name: tx-blaster-config
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.US.1
    name: config-miner
  - behavior: merge
    literals:
      - SETTINGS_CONTEXT=allinone.miner.US.1
    name: tx-blaster-config

patches:
  - patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/ad.datadoghq.com/blockassembly.checks
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://blockassembly-service2.m2.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["blockassembly_subtrees","blockassembly_transactions","blockassembly_add_tx_duration_seconds_bucket"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: service=blockassembly
  - patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/ad.datadoghq.com/propagation.checks
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://propagation-service2.m2.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["propagation_processed_transactions","validator_transactions_validate_micros_bucket","validator_transactions_store_utxos_micros_bucket","validator_transactions_spend_utxos_micros_bucket"]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: service=propagation
  - patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/ad.datadoghq.com/tx-blaster.checks
        value: |
          {
              "openmetrics": {
                  "init_config": {},
                  "instances": [
                      {
                          "openmetrics_endpoint": "http://tx-blaster-service2.m2.svc.cluster.local:9091/metrics",
                          "namespace": "prom",
                          "metrics": ["tx_blaster_processed_transactions",]
                      }
                  ]
              }
          }
    target:
      kind: Deployment
      labelSelector: service=tx-blaster

  - patch: |-
      - op: replace
        path: /spec/dnsNames
        value: 
         - miner-us-1.allinone.ubsv.dev
    target:
      kind: Certificate
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner-us-1
    target:
      kind: IngressRouteTCP
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /spec/routes/0/services/0/name
        value: miner-us-1
      - op: replace
        path: /spec/routes/0/match
        value: Host(`miner-us-1.allinone.ubsv.dev`)
    target:
      kind: IngressRoute
      labelSelector: service=miner
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: miner-us-1
    target:
      kind: ClusterRoleBinding
  - patch: |-
      - op: replace
        path: /spec/template/spec/serviceAccountName
        value: sa-miner-us-1
    target:
      kind: Deployment

  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: postgres-pvc-us-1
    target:
      kind: Deployment
      labelSelector: service=postgres
  - patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: subtree-pvc-us-1
    target:
      kind: Deployment
      labelSelector: service=miner
