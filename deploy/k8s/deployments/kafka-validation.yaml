apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-validation
  namespace: validation-service
  labels:
    monitor: prometheus
    app: kafka-validation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: kafka-validation
  template:
    metadata:
      labels:
        app: kafka-validation
        monitor: prometheus
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: kafka-validation
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: kafka-validation
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/IMAGE:TAG
          args: ["-validator=1"]
          env:
          - name: SETTINGS_CONTEXT
            value: "kubernetes"
          - name: utxostore
            value: aerospike://192.168.13.144:3000/test
#            value: memory://utxostore-service.utxostore-service.svc.cluster.local:8082
#            value: foundationdb://foundationdb-exporter-service:9444
          - name: validator_grpcAddress
            value: 0.0.0.0:8081
          - name: validator_kafkaBrokers
            value: kafka://kafka-cluster-headless.kafka.svc.cluster.local:9092/txs
          - name: profilerAddr
            value: 0.0.0.0:9091
          - name: JAEGER_AGENT_HOST
            value: jaeger-cluster-agent.jaeger.svc.cluster.local
          - name: JAEGER_AGENT_PORT
            value: "6831"
          - name: SERVICE_NAME
            value: kafka-validation-service
          - name: use_cgo_verifier
            value: "true"
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 500Mi
              cpu: "2"
            limits:
              memory: 1Gi
              cpu: "2"
