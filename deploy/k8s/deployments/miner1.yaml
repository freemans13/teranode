apiVersion: apps/v1
kind: Deployment
metadata:
  name: miner1
  namespace: miner1
  labels:
    app: miner1
    project: miner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miner1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: miner1
    spec:
      serviceAccountName: s3-push-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: miner1
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: miner
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/IMAGE:TAG
          command: [ "./dlv", "--listen=:4040", "--continue", "--accept-multiclient", "--headless=true", "--api-version=2", "exec", "./ubsv.run", "--" ]
          args: [ ]
          env:
            - name: SETTINGS_CONTEXT
              value: allinone.miner.1
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
          ports:
            - containerPort: 4040
              protocol: TCP
            - containerPort: 8082
              protocol: TCP
            - containerPort: 8083
              protocol: TCP
            - containerPort: 8084
              protocol: TCP
            - containerPort: 8089
              protocol: TCP
            - containerPort: 8090
              protocol: TCP
            - containerPort: 8091
              protocol: TCP
            - containerPort: 8093
              protocol: TCP
            - containerPort: 8099
              protocol: TCP
            - containerPort: 8092
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 9095
              protocol: TCP
          resources:
            requests:
              memory: 12Gi
              cpu: "6"
            limits:
              memory: 12Gi
              cpu: "6"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
