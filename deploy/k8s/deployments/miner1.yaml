apiVersion: apps/v1
kind: Deployment
metadata:
  name: miner1
  namespace: miner1
  labels:
    app: miner1
    project: miner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miner1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: miner1
    spec:
      serviceAccountName: s3-push-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: miner1
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: miner
          image:  434394763103.dkr.ecr.eu-north-1.amazonaws.com/ubsv:c36d86a76e3bf83786eabb2aa6decd4b57df17b0
          command: [ "./dlv", "--listen=:4040", "--continue", "--accept-multiclient", "--headless=true", "--api-version=2", "exec", "./ubsv.run", "--" ]
          args: [ "-coinbase=1","-bootstrap=1" ]
          env:
            - name: SETTINGS_CONTEXT
              value: allinone.miner.1
            - name: utxostore # todo joe to create a better postgres db
              value: postgres://miner1:miner1@services-db.cipebxcxpkpk.eu-north-1.rds.amazonaws.com:5432/ubsv1
            - name: txmeta_store
              value: postgres://miner1:miner1@services-db.cipebxcxpkpk.eu-north-1.rds.amazonaws.com:5432/ubsv1
            - name: blockchain_store
              value: postgres://miner1:miner1@services-db.cipebxcxpkpk.eu-north-1.rds.amazonaws.com:5432/ubsv1
            - name: txstore # todo change bucket txstore
              value: minio://minio:minio123@myminio-hl.minio.svc.cluster.local:9000/tx-lake
            - name: subtreestore
              value: minio://minio:minio123@myminio-hl.minio.svc.cluster.local:9000/subtrees-lake?objectLocking=true&tempTTL=true
            - name: startTxMetaStore
              value: "false"
            - name: startUtxoStore
              value: "false"
            - name: blobserver_grpcListenAddress
              value: ":8091"
            - name: blockassembly_grpcAddress
              value: ":8085"
            - name: blobserver_httpAddress
              value: "https://miner1.miner1.svc.cluster.local:8090"
            - name: blobserver_clientName
              value: "Miner 1"
            - name: blobserver_grpcAddress
              value: "miner1.miner1.svc.cluster.local:8091"
            - name: bootstrap_grpcListenAddress
              value: ":8089"
            - name: bootstrap_httpListenAddress
              value: ":8099"
            - name: bootstrap_grpcAddress
              value: ":8089"
            - name: startBootstrapServer
              value: "True"
            - name: startCoinbase
              value: "True"
            - name: coinbase_grpcListenAddress
              value: :8093
            - name: coinbase_store
              value: postgres://coinbase_allinone:coinbase_allinone@services-db.cipebxcxpkpk.eu-north-1.rds.amazonaws.com:5432/coinbase_allinone
            - name: blobserver_httpListenAddress
              value: ":8090"
            - name: blockassembly_grpcListenAddress
              value: ":8085"
            - name: blockchain_grpcListenAddress
              value: ":8087"
            - name: blockvalidation_grpcListenAddress
              value: ":8088"
            - name: gocore_stats_addr
              value: ":9092"
            - name: propagation_grpcListenAddress
              value: ":8084"
            - name: txmeta_grpcListenAddress
              value: ":8086"
            - name: validator_grpcListenAddress
              value: ":8081"
            - name: seeder_grpcListenAddress
              value: ":8083"
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: profilerAddr
              value: 0.0.0.0:9091
            - name: SERVICE_NAME
              value: miner1
          ports:
            - containerPort: 4040
              protocol: TCP
            - containerPort: 8082
              protocol: TCP
            - containerPort: 8083
              protocol: TCP
            - containerPort: 8084
              protocol: TCP
            - containerPort: 8089
              protocol: TCP
            - containerPort: 8090
              protocol: TCP
            - containerPort: 8091
              protocol: TCP
            - containerPort: 8093
              protocol: TCP
            - containerPort: 8099
              protocol: TCP
            - containerPort: 8092
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
          resources:
            requests:
              memory: 12Gi
              cpu: "6"
            limits:
              memory: 12Gi
              cpu: "6"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
