apiVersion: apps/v1
kind: Deployment
metadata:
  name: tx-blaster
  namespace: tx-blaster-service
  labels:
    app: tx-blaster
    project: service
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tx-blaster
  template:
    metadata:
      labels:
        app: tx-blaster
    spec:
      serviceAccountName: s3-push-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: tx-blaster
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: tx-blaster
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/IMAGE:TAG
          command:
            - ./blaster.run
          args: ["-print=10","-workers=1" ]
          env:
            - name: SETTINGS_CONTEXT
              value: "kubernetes"
            - name: txblaster_propagation_grpcTargets
              value: "miner1.miner1.svc.cluster.local:8084|miner2.miner2.svc.cluster.local:8084|miner3.miner3.svc.cluster.local:8084"
            - name: coinbase_grpcAddress
              value: coinbase-service.coinbase-service.svc.cluster.local:8093
            - name: profilerAddr
              value: 0.0.0.0:9091
            - name: tx_blaster_profilerAddr
              value: 0.0.0.0:9092
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: coinbaseSimpleTracker
              value: "true"
            - name: SERVICE_NAME
              value: tx-blaster-service
            - name: number_of_outputs
              value: "5000"
            - name: use_cgo_signer
              value: "true"
          ports:
            - containerPort: 8086
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 9092
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 1Gi
              cpu: "1"
            limits:
              memory: 2Gi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
