apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap-service
  namespace: bootstrap-service
  labels:
    app: bootstrap
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bootstrap
  template:
    metadata:
      labels:
        app: bootstrap
    spec:
      serviceAccountName: s3-push-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bootstrap
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: bootstrap-service
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/IMAGE:TAG
          args: [ "-bootstrap=1",  ]
          env:
            - name: bootstrap_grpcAddress
              value: ":8089"
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: SETTINGS_CONTEXT
              value: "kubernetes"
            - name: profilerAddr
              value: 0.0.0.0:9091
            - name: SERVICE_NAME
              value: bootstrap-service
          ports:
            - containerPort: 8089
              protocol: TCP
          resources:
            requests:
              memory: 1Gi
              cpu: "0.5"
            limits:
              memory: 1Gi
              cpu: "0.5"
