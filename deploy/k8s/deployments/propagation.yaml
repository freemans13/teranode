apiVersion: apps/v1
kind: Deployment
metadata:
  name: propagation
  namespace: propagation-service
  labels:
    monitor: prometheus
    app: propagation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: propagation
  template:
    metadata:
      labels:
        app: propagation
        monitor: prometheus
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: propagation
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: propagation
          image: eu.gcr.io/PROJECT/IMAGE:TAG
          args: ["-propagation=1"]
          # command: "You can override the entrypoint with a command."
          #command: ["./dlv", "--listen=:4040", "--continue", "--accept-multiclient", "--headless=true", "--api-version=2", "exec", "./ubsv.run", "--"]
          #command: ["./ubsv.run"]
          env:
            - name: SETTINGS_CONTEXT
              value: "kubernetes"
            - name: validator_grpcAddress
              value: k8s:///validation-service.validation-service.svc.cluster.local:8081
            - name: profilerAddr
              value: 0.0.0.0:9091
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: SERVICE_NAME
              value: propagation-service
          ports:
            - containerPort: 8833
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 8Gi
              cpu: "2"
