apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockvalidation
  namespace: blockvalidation-service
  labels:
    app: blockvalidation
    project: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockvalidation
  template:
    metadata:
      labels:
        app: blockvalidation
    spec:
      serviceAccountName: s3-push-service-account
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: blockvalidation
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: blockvalidation
          image: 434394763103.dkr.ecr.eu-north-1.amazonaws.com/ubsv:eb4c9c580be88d299492d0956ee625daec000113
          args: [ "-blockvalidation=1" ]
          env:
            - name: SETTINGS_CONTEXT
              value: "kubernetes"
            - name: profilerAddr
              value: 0.0.0.0:9091
            - name: JAEGER_AGENT_HOST
              value: jaeger-cluster-agent.jaeger.svc.cluster.local
            - name: JAEGER_AGENT_PORT
              value: "6831"
            - name: SERVICE_NAME
              value: blockvalidation-service
            - name: blockchain_grpcAddress
              value: "blockchain-service.blockchain-service.svc.cluster.local:8087"
            - name: txstore
              value: s3:///ubsv-utxo-store?region=eu-north-1
            - name: subtreestore
              value: s3:///ubsv-subtree-store?region=eu-north-1 # todo separate the data later
            - name: txmeta_store
              value: aerospike://tx-status-store-0.ubsv.internal:3000/txmeta_store
            - name: utxostore
              value: aerospike://utxo-store-0.ubsv.internal:3000/utxostore
          ports:
            - containerPort: 8088
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 1Gi
              cpu: "2"
            limits:
              memory: 2Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
