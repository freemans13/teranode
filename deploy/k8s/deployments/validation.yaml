apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation
  namespace: validation-service
  labels:
    monitor: prometheus
    app: validation
spec:
  replicas: 0
  selector:
    matchLabels:
      app: validation
  template:
    metadata:
      labels:
        app: validation
        monitor: prometheus
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: validation
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: validation
          image: eu.gcr.io/PROJECT/IMAGE:TAG
          args: ["-validator=1"]
          env:
          - name: SETTINGS_CONTEXT
            value: "kubernetes"
          - name: utxostore
            # value: aerospike://10.138.0.29:3000/test
            value: memory://utxostore-service.utxostore-service.svc.cluster.local:8082
            #value: foundationdb://foundationdb-exporter-service:9444
          - name: validator_grpcAddress
            value: 0.0.0.0:8081
          - name: blockassembly_grpcAddress
            value: k8s:///blockassembly-service.blockassembly-service.svc.cluster.local:8085
          - name: profilerAddr
            value: 0.0.0.0:9091
          - name: JAEGER_AGENT_HOST
            value: jaeger-cluster-agent.jaeger.svc.cluster.local
          - name: JAEGER_AGENT_PORT
            value: "6831"
          - name: SERVICE_NAME
            value: validation-service
          - name: use_cgo_verifier
            value: "true"
          ports:
            - containerPort: 8081
              protocol: TCP
            - containerPort: 9091
              protocol: TCP
            - containerPort: 4040
              protocol: TCP
          resources:
            requests:
              memory: 1Gi
              cpu: "2"
            limits:
              memory: 2Gi
              cpu: "2"
