apiVersion: v1
kind: PersistentVolume
metadata:
  name: subtree-lustre-pv
spec:
  capacity:
    storage: 1200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  mountOptions:
    - flock
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: fsx.csi.aws.com
    volumeHandle: fs-019f10b4408f3253c
    volumeAttributes:
      dnsname: fs-019f10b4408f3253c.fsx.eu-central-1.amazonaws.com
      mountname: pnysxbev
