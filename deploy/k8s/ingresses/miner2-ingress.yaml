apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: miner2-ingressroute-tcp-8084
  namespace: miner2
spec:
  entryPoints:
    - prop-grpc
  routes:
  - match: HostSNI(`miner2.allinone.ubsv.dev`)
    services:
    - name: miner2
      port: 8084
  tls:
    passthrough: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: miner2-ingressroute-tcp-8090
  namespace: miner2
spec:
  entryPoints:
    - blob-http
  routes:
  - match: HostSNI(`miner2.allinone.ubsv.dev`)
    services:
    - name: miner2
      port: 8090
  tls:
    # use miner2-cert
#    secretName: miner2-tls
    passthrough: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: miner2-ingressroute-tcp-8091
