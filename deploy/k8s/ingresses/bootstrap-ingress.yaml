apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: bootstrap-ingressroute-grpc-8089
  namespace: bootstrap-service
spec:
  entryPoints:
    - bootstrap-grpc
  routes:
  - match: Host(`bootstrap.ubsv.dev`)
    kind: Rule
    services:
    - name: bootstrap-service
      port: 8089
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: bootstrap-ingressroute-http-8099
  namespace: bootstrap-service
spec:
  entryPoints:
    - bootstrap-http
  routes:
  - match: Host(`bootstrap.ubsv.dev`)
    kind: Rule
    services:
    - name: bootstrap-service
      port: 8099
