apiVersion: v1
kind: Service
metadata:
  name: propagation-service
  namespace: aerospike-test
  labels:
    app: propagation
    monitor: prometheus
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: propagation
  ports:
    - name: http
      port: 8833
      targetPort: 8833
      protocol: TCP
    - name: grpc
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: delve
      port: 4041
      targetPort: 4040
      protocol: TCP
