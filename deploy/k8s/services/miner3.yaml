apiVersion: v1
kind: Service
metadata:
  name: miner3
  namespace: miner3
  labels:
    app: miner3
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: miner3
  ports:
    - name: seeder
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: propagation
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: http
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: delve
      port: 4041
      targetPort: 4040
      protocol: TCP
