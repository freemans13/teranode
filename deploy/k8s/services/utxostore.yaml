apiVersion: v1
kind: Service
metadata:
  name: utxostore-service
  namespace: utxostore-service
  labels:
    app: utxostore
    monitor: prometheus
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: utxostore
  ports:
    - name: tcp
      port: 8082
      targetPort: 8082
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
