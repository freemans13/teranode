apiVersion: v1
kind: Service
metadata:
  name: seeder-service
  namespace: aerospike-test
  labels:
    app: seeder
    monitor: prometheus
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: seeder
  ports:
    - name: tcp
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
