apiVersion: v1
kind: Service
metadata:
  name: miner2
  namespace: miner2
  labels:
    app: miner2
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: miner2
  ports:
    - name: seeder
      port: 8083
      targetPort: 8083
      protocol: TCP
    - name: propagation
      port: 8084
      targetPort: 8084
      protocol: TCP
    - name: http
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: blob-http
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: blob-grpc
      port: 8091
      targetPort: 8091
      protocol: TCP
    - name: coinbasetracker-grpc
      port: 8092
      targetPort: 8092
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: delve
      port: 4041
      targetPort: 4040
      protocol: TCP
