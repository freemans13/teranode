apiVersion: v1
kind: Service
metadata:
  name: bootstrap-service
  namespace: bootstrap-service
  labels:
    app: bootstrap
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: bootstrap
  ports:
    - name: bootstrap
      port: 8089
      targetPort: 8087
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
