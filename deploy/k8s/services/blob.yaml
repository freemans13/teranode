apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gateway-service
  labels:
    app: gateway
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: gateway
  ports:
    - name: gateway
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
