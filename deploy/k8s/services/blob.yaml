apiVersion: v1
kind: Service
metadata:
  name: blob-service
  namespace: blob-service
  labels:
    app: blob
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: blob
  ports:
    - name: blob-grpc
      port: 8091
      targetPort: 8091
      protocol: TCP
    - name: blob-http
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
