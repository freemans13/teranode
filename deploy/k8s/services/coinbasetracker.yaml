apiVersion: v1
kind: Service
metadata:
  name: coinbasetracker-service
  namespace: coinbasetracker-service
  labels:
    app: coinbasetracker
  annotations:
    prometheus.io/port: "9091"
    prometheus.io/scrape: "true"
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
  - IPv4
  selector:
    app: coinbasetracker
  ports:
    - name: tcp
      port: 8092
      targetPort: 8092
      protocol: TCP
    - name: profiler
      port: 9091
      targetPort: 9091
      protocol: TCP
